<!-- layouts/shortcodes/gallery.html -->
{{ $folder := .Get 0 | default "figs" }}
{{ $matchString := printf "%s/*" $folder }}

<style>
  .square-grid-container {
    display: grid;
    /* Adjust '300px' below to make squares larger/smaller */
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
    gap: 15px;
    align-items: start; /* Prevents stretching when captions exist */
  }

  .grid-item {
    margin: 0;
    display: flex;
    flex-direction: column; /* Stack img and figcaption */
  }

  .grid-item img {
    width: 100%;
    aspect-ratio: 1 / 1; /* Forces a perfect square */
    object-fit: cover; /* Zooms/crops to fill the square without stretching */
    display: block;
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .grid-caption {
    font-size: 0.85em;
    text-align: center;
    color: #555;
    margin-top: 8px;
    line-height: 1.3;
  }
</style>

<div class="square-grid-container">
  {{ range .Page.Resources.Match $matchString }}
    {{ $alt := .Params.alt | default .Name }}
    
    <figure class="grid-item">
      <img src="{{ .RelPermalink }}" alt="{{ $alt }}" loading="lazy">
      
      {{ with .Params.caption }}
        <figcaption class="grid-caption">
          {{ . }}
        </figcaption>
      {{ end }}
    </figure>
    
  {{ end }}
</div>
