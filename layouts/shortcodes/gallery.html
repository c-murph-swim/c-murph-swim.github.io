<div class="gallery" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;">
  {{ $folder := .Get 0 | default "figs" }}
  {{ $matchString := printf "%s/*" $folder }}
  
  {{ range .Page.Resources.Match $matchString }}
    <figure class="gallery-item" style="margin: 0;">
      
      <!-- Set alt text: prefer params.alt, then Title, then fallback to filename -->
      {{ $alt := .Params.alt | default .Title | default .Name }}
      
      <img src="{{ .RelPermalink }}" alt="{{ $alt }}" style="width: 100%; height: auto; border-radius: 4px;">
      
      <!-- Only display a caption if you defined a 'title' in the front matter -->
      {{ with .Title }}
        <figcaption style="font-size: 0.9em; text-align: center; color: #666; margin-top: 8px;">
          {{ . }}
        </figcaption>
      {{ end }}
      
    </figure>
  {{ end }}
</div>
